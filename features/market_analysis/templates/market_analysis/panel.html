{# 시장 분석 작업 영역. 입력 항목은 공통 UI 확인용 예시이며 명세 확정 후 담당자가 교체합니다.
   통계·차트는 실제 조회 결과만 표시합니다. 꾸민 수치를 넣지 않습니다. #}
<div class="workspace">
  <form class="card" aria-labelledby="market_analysis-input-title">
    <div class="card-header">
      <div>
        <h2 class="card-title" id="market_analysis-input-title">조회 조건</h2>
        <p class="card-description">품목과 기간을 정해 수입 동향을 조회합니다.</p>
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="market_analysis-code">품목코드</label>
      <input class="input" id="market_analysis-code" name="code" type="text" autocomplete="off"
             aria-describedby="market_analysis-code-hint">
      <p class="field-hint" id="market_analysis-code-hint">코드 체계와 조회 범위는 기능 명세 확정 후 안내합니다.</p>
    </div>
    <div class="grid">
      <div class="field">
        <label class="field-label" for="market_analysis-from">시작 월</label>
        <input class="input" id="market_analysis-from" name="from" type="month">
      </div>
      <div class="field">
        <label class="field-label" for="market_analysis-to">종료 월</label>
        <input class="input" id="market_analysis-to" name="to" type="month">
      </div>
    </div>
    <div class="btn-row">
      <button type="submit" class="btn btn-primary" disabled aria-describedby="market_analysis-pending">분석 실행</button>
      <span class="field-hint" id="market_analysis-pending">준비 중: 아직 사용할 수 없습니다.</span>
    </div>
  </form>

  <section class="card" aria-labelledby="market_analysis-result-title">
    <div class="card-header">
      <div>
        <h2 class="card-title" id="market_analysis-result-title">분석 결과</h2>
        <p class="card-description">수입액·수입량·주요 공급국·평균단가 추세와 출처를 표시합니다.</p>
      </div>
      <button type="button" class="btn btn-secondary" disabled>PDF 다운로드</button>
    </div>
    <div class="empty-state">
      <p class="empty-state-title">아직 결과가 없습니다</p>
      <p>분석 기능이 개발되면 조회 결과가 이곳에 표시됩니다.</p>
    </div>
  </section>
</div>
